<title>Ink Flow 3D</title>
<style>
  :root {
    --ground: #05070C;
    --panel: rgba(13, 20, 32, 0.72);
    --line: rgba(184, 199, 218, 0.14);
    --text: #B8C7DA;
    --muted: #5C6E84;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, ui-sans-serif, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.stir { cursor: crosshair; }
  #c:active { cursor: grabbing; }

  .lockup {
    position: fixed; top: 20px; left: 24px;
    pointer-events: none; user-select: none;
    display: flex; flex-direction: column; gap: 2px;
  }
  .lockup .name { font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: var(--text); }
  .lockup .sub { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }

  .hint {
    position: fixed; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    font-size: 13px; letter-spacing: 0.25em; text-indent: 0.25em;
    color: var(--muted);
    pointer-events: none; user-select: none;
    transition: opacity 1.2s ease;
    text-align: center; line-height: 2.2;
  }
  .hint.gone { opacity: 0; }

  .panel {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
    padding: 12px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    max-width: calc(100vw - 24px);
    flex-wrap: wrap; justify-content: center;
  }
  .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 104px; }
  .ctl label {
    font-size: 10px; letter-spacing: 0.12em; color: var(--muted);
    display: flex; justify-content: space-between;
  }
  .ctl label output {
    font-family: ui-monospace, "Cascadia Code", monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; border-radius: 1px;
    background: rgba(184, 199, 218, 0.22);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: none; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: none; cursor: pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(184,199,218,.35); }
  .btns { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 12px; letter-spacing: 0.06em;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: rgba(184, 199, 218, 0.08); border-color: rgba(184, 199, 218, 0.3); }
  button:focus-visible { outline: 2px solid rgba(184,199,218,.5); outline-offset: 2px; }
  button[aria-pressed="true"] { background: rgba(184, 199, 218, 0.14); border-color: rgba(184, 199, 218, 0.35); }

  .err {
    position: fixed; inset: 0; display: none;
    place-items: center; text-align: center;
    font-size: 14px; line-height: 1.9; color: var(--muted);
    padding: 24px;
  }
</style>

<canvas id="c"></canvas>

<div class="lockup" aria-hidden="true">
  <span class="name">INK FLOW 3D</span>
  <span class="sub">体積流体シミュレーション</span>
</div>

<div class="hint" id="hint">ドラッグで回転 ・ ホイール / ピンチで拡大<br>「かき混ぜ」モードでドラッグすると煙を操れる</div>

<div class="panel" role="group" aria-label="シミュレーション設定">
  <div class="ctl">
    <label for="curl">渦の強さ <output id="curlV">8</output></label>
    <input type="range" id="curl" min="0" max="20" step="0.5" value="8">
  </div>
  <div class="ctl">
    <label for="buoy">浮力 <output id="buoyV">28</output></label>
    <input type="range" id="buoy" min="0" max="60" step="1" value="28">
  </div>
  <div class="ctl">
    <label for="fade">インクの持続 <output id="fadeV">0.75</output></label>
    <input type="range" id="fade" min="0" max="1" step="0.05" value="0.75">
  </div>
  <div class="ctl">
    <label for="dens">濃さ <output id="densV">14</output></label>
    <input type="range" id="dens" min="4" max="30" step="1" value="14">
  </div>
  <div class="btns">
    <button id="stir" aria-pressed="false">かき混ぜ</button>
    <button id="burst">ひと吹き</button>
    <button id="clear">クリア</button>
    <button id="pause" aria-pressed="false">一時停止</button>
  </div>
</div>

<div class="err" id="err">
  このブラウザは WebGL2 の浮動小数点テクスチャに対応していないため、<br>
  シミュレーションを実行できません。デスクトップの Chrome / Edge / Firefox でお試しください。
</div>

<script>
(() => {
'use strict';

// ---------- WebGL setup ----------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false });
const errEl = document.getElementById('err');
function fatal() { errEl.style.display = 'grid'; }
if (!gl) { fatal(); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fatal(); return; }
const supportLinear = !!gl.getExtension('OES_texture_half_float_linear');

// 64^3 grid stored as an 8x8 atlas of 64x64 slices in one 512x512 texture
const N = 64, TILES = 8, TEX = N * TILES;

const params = {
  curl: 8,
  buoyancy: 28,
  velDissipation: 0.992,
  dyeDissipation: 0.985,
  density: 14,
  pressureIters: 20,
  paused: false,
  stir: false,
};

// ---------- shaders (GLSL ES 3.0) ----------
const VERT = `#version 300 es
in vec2 aPosition;
void main () { gl_Position = vec4(aPosition, 0.0, 1.0); }`;

// helpers shared by every simulation shader: flat-3D-texture addressing
const COMMON = `
ivec2 tcoord (ivec3 p) {
  p = clamp(p, ivec3(0), ivec3(63));
  return ivec2((p.z % 8) * 64 + p.x, (p.z / 8) * 64 + p.y);
}
vec4 fetch3 (sampler2D t, ivec3 p) { return texelFetch(t, tcoord(p), 0); }
vec4 slice2 (sampler2D t, vec2 xy, float z) {
  xy = clamp(xy, vec2(0.5), vec2(63.5));
  vec2 tile = vec2(mod(z, 8.0), floor(z / 8.0));
  return texture(t, (tile * 64.0 + xy) / 512.0);
}
vec4 sample3 (sampler2D t, vec3 p) {   // p in voxel coords [0,64]
  p = clamp(p, vec3(0.5), vec3(63.5));
  float z = p.z - 0.5;
  float z0 = floor(z);
  return mix(slice2(t, p.xy, z0), slice2(t, p.xy, min(z0 + 1.0, 63.0)), z - z0);
}
vec3 voxelCoord () {
  vec2 fc = gl_FragCoord.xy;
  vec2 tile = floor(fc / 64.0);
  return vec3(fc.x - tile.x * 64.0, fc.y - tile.y * 64.0, tile.y * 8.0 + tile.x + 0.5);
}`;

const FRAG = {
  advect: `
uniform sampler2D uVel;
uniform sampler2D uSrc;
uniform float dt;
uniform float uDiss;
void main () {
  vec3 p = voxelCoord();
  vec3 v = sample3(uVel, p).xyz;
  frag = uDiss * sample3(uSrc, p - dt * v);
}`,

  splat: `
uniform sampler2D uTarget;
uniform vec3 uPoint;
uniform vec4 uValue;
uniform float uRadius;
void main () {
  vec3 p = voxelCoord();
  vec3 d = p - uPoint;
  float g = exp(-dot(d, d) / uRadius);
  frag = fetch3(uTarget, ivec3(p)) + g * uValue;
}`,

  buoyancy: `
uniform sampler2D uVel;
uniform sampler2D uDye;
uniform float dt;
uniform float uBuoy;
void main () {
  ivec3 i = ivec3(voxelCoord());
  vec4 v = fetch3(uVel, i);
  v.y += uBuoy * fetch3(uDye, i).a * dt;
  frag = v;
}`,

  curl: `
uniform sampler2D uVel;
void main () {
  ivec3 i = ivec3(voxelCoord());
  vec3 L = fetch3(uVel, i + ivec3(-1, 0, 0)).xyz;
  vec3 R = fetch3(uVel, i + ivec3( 1, 0, 0)).xyz;
  vec3 B = fetch3(uVel, i + ivec3( 0,-1, 0)).xyz;
  vec3 T = fetch3(uVel, i + ivec3( 0, 1, 0)).xyz;
  vec3 K = fetch3(uVel, i + ivec3( 0, 0,-1)).xyz;
  vec3 F = fetch3(uVel, i + ivec3( 0, 0, 1)).xyz;
  frag = vec4(0.5 * vec3(
    (T.z - B.z) - (F.y - K.y),
    (F.x - K.x) - (R.z - L.z),
    (R.y - L.y) - (T.x - B.x)), 0.0);
}`,

  vorticity: `
uniform sampler2D uVel;
uniform sampler2D uCurl;
uniform float uEps;
uniform float dt;
void main () {
  ivec3 i = ivec3(voxelCoord());
  float L = length(fetch3(uCurl, i + ivec3(-1, 0, 0)).xyz);
  float R = length(fetch3(uCurl, i + ivec3( 1, 0, 0)).xyz);
  float B = length(fetch3(uCurl, i + ivec3( 0,-1, 0)).xyz);
  float T = length(fetch3(uCurl, i + ivec3( 0, 1, 0)).xyz);
  float K = length(fetch3(uCurl, i + ivec3( 0, 0,-1)).xyz);
  float F = length(fetch3(uCurl, i + ivec3( 0, 0, 1)).xyz);
  vec3 w = fetch3(uCurl, i).xyz;
  vec3 eta = 0.5 * vec3(R - L, T - B, F - K);
  eta /= length(eta) + 1e-5;
  vec4 v = fetch3(uVel, i);
  v.xyz += uEps * cross(eta, w) * dt;
  v.xyz = clamp(v.xyz, vec3(-300.0), vec3(300.0));
  frag = v;
}`,

  divergence: `
uniform sampler2D uVel;
void main () {
  ivec3 i = ivec3(voxelCoord());
  vec3 C = fetch3(uVel, i).xyz;
  float L = (i.x ==  0) ? -C.x : fetch3(uVel, i + ivec3(-1, 0, 0)).x;
  float R = (i.x == 63) ? -C.x : fetch3(uVel, i + ivec3( 1, 0, 0)).x;
  float B = (i.y ==  0) ? -C.y : fetch3(uVel, i + ivec3( 0,-1, 0)).y;
  float T = (i.y == 63) ? -C.y : fetch3(uVel, i + ivec3( 0, 1, 0)).y;
  float K = (i.z ==  0) ? -C.z : fetch3(uVel, i + ivec3( 0, 0,-1)).z;
  float F = (i.z == 63) ? -C.z : fetch3(uVel, i + ivec3( 0, 0, 1)).z;
  frag = vec4(0.5 * (R - L + T - B + F - K), 0.0, 0.0, 1.0);
}`,

  clearp: `
uniform sampler2D uTex;
uniform float uValue;
void main () { frag = uValue * texelFetch(uTex, ivec2(gl_FragCoord.xy), 0); }`,

  pressure: `
uniform sampler2D uPressure;
uniform sampler2D uDiv;
void main () {
  ivec3 i = ivec3(voxelCoord());
  float L = fetch3(uPressure, i + ivec3(-1, 0, 0)).x;
  float R = fetch3(uPressure, i + ivec3( 1, 0, 0)).x;
  float B = fetch3(uPressure, i + ivec3( 0,-1, 0)).x;
  float T = fetch3(uPressure, i + ivec3( 0, 1, 0)).x;
  float K = fetch3(uPressure, i + ivec3( 0, 0,-1)).x;
  float F = fetch3(uPressure, i + ivec3( 0, 0, 1)).x;
  float div = fetch3(uDiv, i).x;
  frag = vec4((L + R + B + T + K + F - div) / 6.0, 0.0, 0.0, 1.0);
}`,

  gradsub: `
uniform sampler2D uPressure;
uniform sampler2D uVel;
void main () {
  ivec3 i = ivec3(voxelCoord());
  float L = fetch3(uPressure, i + ivec3(-1, 0, 0)).x;
  float R = fetch3(uPressure, i + ivec3( 1, 0, 0)).x;
  float B = fetch3(uPressure, i + ivec3( 0,-1, 0)).x;
  float T = fetch3(uPressure, i + ivec3( 0, 1, 0)).x;
  float K = fetch3(uPressure, i + ivec3( 0, 0,-1)).x;
  float F = fetch3(uPressure, i + ivec3( 0, 0, 1)).x;
  vec4 v = fetch3(uVel, i);
  v.xyz -= 0.5 * vec3(R - L, T - B, F - K);
  frag = v;
}`,

  render: `
uniform sampler2D uDye;
uniform vec2 uRes;
uniform vec3 uEye;
uniform vec3 uRight;
uniform vec3 uUp;
uniform vec3 uFwd;
uniform float uTan;
uniform float uDensity;
vec3 bgColor (vec2 uv) {
  return mix(vec3(0.016, 0.022, 0.036), vec3(0.040, 0.052, 0.078), uv.y);
}
void main () {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 ndc = uv * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  vec3 dir = normalize(uFwd + uTan * (ndc.x * uRight + ndc.y * uUp));
  vec3 bg = bgColor(uv);

  vec3 inv = 1.0 / dir;
  vec3 t0 = (vec3(-0.5) - uEye) * inv;
  vec3 t1 = (vec3( 0.5) - uEye) * inv;
  vec3 tmin3 = min(t0, t1);
  vec3 tmax3 = max(t0, t1);
  float tn = max(max(tmin3.x, tmin3.y), tmin3.z);
  float tf = min(min(tmax3.x, tmax3.y), tmax3.z);
  float d0 = distance(uv, vec2(0.5));
  float vig = 1.0 - 0.3 * d0 * d0;
  if (tf <= max(tn, 0.0)) { frag = vec4(bg * vig, 1.0); return; }
  tn = max(tn, 0.0);

  const int STEPS = 72;
  float stepLen = (tf - tn) / float(STEPS);
  vec3 lightDir = normalize(vec3(0.4, 0.75, 0.35));
  vec3 pos = uEye + dir * (tn + stepLen * 0.5);
  vec3 stepV = dir * stepLen;
  float T = 1.0;
  vec3 Lo = vec3(0.0);
  for (int s = 0; s < STEPS; s++) {
    vec4 dsamp = sample3(uDye, (pos + 0.5) * 64.0);
    float dens = dsamp.a * uDensity * stepLen;
    if (dens > 1e-4) {
      float sh = 0.0;
      vec3 lp = pos;
      for (int j = 0; j < 4; j++) {
        lp += lightDir * 0.07;
        sh += sample3(uDye, (lp + 0.5) * 64.0).a;
      }
      float shade = exp(-sh * uDensity * 0.084);
      vec3 tint = dsamp.rgb / max(dsamp.a, 1e-4);
      float a = 1.0 - exp(-dens);
      Lo += T * a * tint * (0.22 + 1.1 * shade);
      T *= 1.0 - a;
      if (T < 0.01) break;
    }
    pos += stepV;
  }
  vec3 col = Lo / (1.0 + Lo * 0.25) + T * bg;
  frag = vec4(col * vig, 1.0);
}`,
};

function compile (type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program (fragBody) {
  const src = '#version 300 es\nprecision highp float;\nout vec4 frag;\n' + COMMON + fragBody;
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, src));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    uniforms[name] = gl.getUniformLocation(p, name);
  }
  return { program: p, uniforms };
}

let progs;
try {
  progs = {
    advect: program(FRAG.advect),
    splat: program(FRAG.splat),
    buoyancy: program(FRAG.buoyancy),
    curl: program(FRAG.curl),
    vorticity: program(FRAG.vorticity),
    divergence: program(FRAG.divergence),
    clearp: program(FRAG.clearp),
    pressure: program(FRAG.pressure),
    gradsub: program(FRAG.gradsub),
    render: program(FRAG.render),
  };
} catch (e) { fatal(); return; }

// fullscreen quad
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(0);

function blit (target) {
  if (target == null) {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  } else {
    gl.viewport(0, 0, TEX, TEX);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  }
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
}

// ---------- framebuffers (all 512x512 flat-3D atlases) ----------
function createFBO (internalFormat, format, filter) {
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, TEX, TEX, 0, format, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture, fbo,
    attach (id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    },
  };
}
function createDoubleFBO (internalFormat, format, filter) {
  let a = createFBO(internalFormat, format, filter);
  let b = createFBO(internalFormat, format, filter);
  return {
    get read () { return a; },
    get write () { return b; },
    swap () { const t = a; a = b; b = t; },
  };
}

const filtering = supportLinear ? gl.LINEAR : gl.NEAREST;
const velocity = createDoubleFBO(gl.RGBA16F, gl.RGBA, filtering);
const dye = createDoubleFBO(gl.RGBA16F, gl.RGBA, filtering);
const curlFBO = createFBO(gl.RGBA16F, gl.RGBA, gl.NEAREST);
const divFBO = createFBO(gl.R16F, gl.RED, gl.NEAREST);
const pressure = createDoubleFBO(gl.R16F, gl.RED, gl.NEAREST);

function resizeCanvas () {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);  // raymarch is per-pixel heavy
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---------- camera ----------
const cam = { theta: 0.6, phi: 0.28, dist: 2.3 };
function cameraBasis () {
  const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta), st = Math.sin(cam.theta);
  const eye = [cam.dist * cp * st, cam.dist * sp, cam.dist * cp * ct];
  const fwd = normalize([-eye[0], -eye[1], -eye[2]]);
  const right = normalize(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  return { eye, fwd, right, up };
}
function cross (a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function normalize (v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
const FOV_TAN = Math.tan((35 * Math.PI / 180) / 2);

// ---------- simulation ----------
function splat (point, value, radius) {
  const u = progs.splat;
  gl.useProgram(u.program);
  gl.uniform3f(u.uniforms.uPoint, point[0], point[1], point[2]);
  gl.uniform1f(u.uniforms.uRadius, radius);
  gl.uniform1i(u.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform4f(u.uniforms.uValue, value.vel[0], value.vel[1], value.vel[2], 0);
  blit(velocity.write);
  velocity.swap();
  gl.uniform1i(u.uniforms.uTarget, dye.read.attach(0));
  gl.uniform4f(u.uniforms.uValue, value.dye[0], value.dye[1], value.dye[2], value.dye[3]);
  blit(dye.write);
  dye.swap();
}

function HSVtoRGB (h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: return [v, t, p];
    case 1: return [q, v, p];
    case 2: return [p, v, t];
    case 3: return [p, q, v];
    case 4: return [t, p, v];
    default: return [v, p, q];
  }
}
let emitHue = Math.random();
let burstHue = Math.random();

function emit (dt, time) {
  emitHue = (emitHue + 0.03 * dt) % 1;
  const c = HSVtoRGB(emitHue, 0.75, 1.0);
  const strength = 9 * dt;
  const jx = Math.sin(time * 1.3) * 60 * dt;
  const jz = Math.cos(time * 0.9) * 60 * dt;
  splat(
    [32 + Math.sin(time * 0.6) * 4, 5, 32 + Math.cos(time * 0.45) * 4],
    { vel: [jx, 170 * dt, jz], dye: [c[0] * strength, c[1] * strength, c[2] * strength, strength] },
    16
  );
}

function randomBurst (count) {
  for (let i = 0; i < count; i++) {
    burstHue = (burstHue + 0.13) % 1;
    const c = HSVtoRGB(burstHue, 0.85, 1.0);
    const p = [10 + Math.random() * 44, 10 + Math.random() * 44, 10 + Math.random() * 44];
    const a = Math.random() * Math.PI * 2;
    const b = (Math.random() - 0.5) * Math.PI;
    const mag = 80 + Math.random() * 90;
    const s = 1.2;
    splat(p, {
      vel: [Math.cos(a) * Math.cos(b) * mag, Math.sin(b) * mag, Math.sin(a) * Math.cos(b) * mag],
      dye: [c[0] * s, c[1] * s, c[2] * s, s],
    }, 25);
  }
}

function clearAll () {
  for (const t of [velocity.read, velocity.write, dye.read, dye.write,
                   pressure.read, pressure.write, divFBO, curlFBO]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
}

function step (dt) {
  gl.disable(gl.BLEND);

  // advect velocity
  let u = progs.advect;
  gl.useProgram(u.program);
  gl.uniform1f(u.uniforms.dt, dt);
  gl.uniform1f(u.uniforms.uDiss, params.velDissipation);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  gl.uniform1i(u.uniforms.uSrc, velocity.read.attach(0));
  blit(velocity.write);
  velocity.swap();

  // buoyancy
  u = progs.buoyancy;
  gl.useProgram(u.program);
  gl.uniform1f(u.uniforms.dt, dt);
  gl.uniform1f(u.uniforms.uBuoy, params.buoyancy);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  gl.uniform1i(u.uniforms.uDye, dye.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // vorticity confinement
  u = progs.curl;
  gl.useProgram(u.program);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  blit(curlFBO);

  u = progs.vorticity;
  gl.useProgram(u.program);
  gl.uniform1f(u.uniforms.uEps, params.curl);
  gl.uniform1f(u.uniforms.dt, dt);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  gl.uniform1i(u.uniforms.uCurl, curlFBO.attach(1));
  blit(velocity.write);
  velocity.swap();

  // pressure projection
  u = progs.divergence;
  gl.useProgram(u.program);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  blit(divFBO);

  u = progs.clearp;
  gl.useProgram(u.program);
  gl.uniform1i(u.uniforms.uTex, pressure.read.attach(0));
  gl.uniform1f(u.uniforms.uValue, 0.8);
  blit(pressure.write);
  pressure.swap();

  u = progs.pressure;
  gl.useProgram(u.program);
  gl.uniform1i(u.uniforms.uDiv, divFBO.attach(0));
  for (let i = 0; i < params.pressureIters; i++) {
    gl.uniform1i(u.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  u = progs.gradsub;
  gl.useProgram(u.program);
  gl.uniform1i(u.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // advect dye
  u = progs.advect;
  gl.useProgram(u.program);
  gl.uniform1f(u.uniforms.dt, dt);
  gl.uniform1f(u.uniforms.uDiss, params.dyeDissipation);
  gl.uniform1i(u.uniforms.uVel, velocity.read.attach(0));
  gl.uniform1i(u.uniforms.uSrc, dye.read.attach(1));
  blit(dye.write);
  dye.swap();
}

function render () {
  const { eye, fwd, right, up } = cameraBasis();
  const u = progs.render;
  gl.useProgram(u.program);
  gl.uniform2f(u.uniforms.uRes, canvas.width, canvas.height);
  gl.uniform3f(u.uniforms.uEye, eye[0], eye[1], eye[2]);
  gl.uniform3f(u.uniforms.uRight, right[0], right[1], right[2]);
  gl.uniform3f(u.uniforms.uUp, up[0], up[1], up[2]);
  gl.uniform3f(u.uniforms.uFwd, fwd[0], fwd[1], fwd[2]);
  gl.uniform1f(u.uniforms.uTan, FOV_TAN);
  gl.uniform1f(u.uniforms.uDensity, params.density);
  gl.uniform1i(u.uniforms.uDye, dye.read.attach(0));
  blit(null);
}

// ---------- input ----------
const hint = document.getElementById('hint');
let interacted = false;
let lastInteraction = performance.now();
const pointers = new Map();   // pointerId -> {x, y}
let pinchDist = 0;
let stirHue = Math.random();
const stirQueue = [];

function markInteracted () {
  lastInteraction = performance.now();
  if (!interacted) { interacted = true; hint.classList.add('gone'); }
}

// project a screen position onto the plane through the origin facing the camera,
// returning voxel coordinates (or null if outside the volume's reach)
function screenToVoxel (clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  let nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = (1 - (clientY - rect.top) / rect.height) * 2 - 1;
  nx *= rect.width / rect.height;
  const { eye, fwd, right, up } = cameraBasis();
  const dir = normalize([
    fwd[0] + FOV_TAN * (nx * right[0] + ny * up[0]),
    fwd[1] + FOV_TAN * (nx * right[1] + ny * up[1]),
    fwd[2] + FOV_TAN * (nx * right[2] + ny * up[2]),
  ]);
  const denom = dir[0] * fwd[0] + dir[1] * fwd[1] + dir[2] * fwd[2];
  const t = -(eye[0] * fwd[0] + eye[1] * fwd[1] + eye[2] * fwd[2]) / denom;
  const p = [eye[0] + dir[0] * t, eye[1] + dir[1] * t, eye[2] + dir[2] * t];
  return [
    Math.min(60, Math.max(3, (p[0] + 0.5) * N)),
    Math.min(60, Math.max(3, (p[1] + 0.5) * N)),
    Math.min(60, Math.max(3, (p[2] + 0.5) * N)),
  ];
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  if (params.stir) stirHue = (stirHue + 0.13) % 1;
  markInteracted();
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) cam.dist = clampDist(cam.dist * (pinchDist / d));
    pinchDist = d;
  } else if (params.stir) {
    const vox = screenToVoxel(e.clientX, e.clientY);
    const rect = canvas.getBoundingClientRect();
    const k = 220 * cam.dist;
    const { right, up } = cameraBasis();
    const fx = (dx / rect.height) * k, fy = (-dy / rect.height) * k;
    const c = HSVtoRGB(stirHue, 0.85, 1.0);
    const s = 0.5;
    stirQueue.push({
      point: vox,
      value: {
        vel: [fx * right[0] + fy * up[0], fx * right[1] + fy * up[1], fx * right[2] + fy * up[2]],
        dye: [c[0] * s, c[1] * s, c[2] * s, s],
      },
      radius: 20,
    });
  } else {
    cam.theta -= dx * 0.008;
    cam.phi = Math.min(1.35, Math.max(-1.2, cam.phi + dy * 0.008));
  }
  markInteracted();
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  pinchDist = 0;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function clampDist (d) { return Math.min(4.0, Math.max(1.4, d)); }
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = clampDist(cam.dist * Math.exp(e.deltaY * 0.001));
  markInteracted();
}, { passive: false });

// ---------- controls ----------
const $ = id => document.getElementById(id);
$('curl').addEventListener('input', e => {
  params.curl = +e.target.value;
  $('curlV').textContent = (+e.target.value).toFixed(1).replace(/\.0$/, '');
});
$('buoy').addEventListener('input', e => {
  params.buoyancy = +e.target.value;
  $('buoyV').textContent = e.target.value;
});
$('fade').addEventListener('input', e => {
  const v = +e.target.value;
  params.dyeDissipation = 1 - (1 - v) * 0.06;  // 0 → 0.94, 1 → 1.0
  $('fadeV').textContent = v.toFixed(2);
});
$('dens').addEventListener('input', e => {
  params.density = +e.target.value;
  $('densV').textContent = e.target.value;
});
$('stir').addEventListener('click', e => {
  params.stir = !params.stir;
  e.target.setAttribute('aria-pressed', String(params.stir));
  canvas.classList.toggle('stir', params.stir);
});
$('burst').addEventListener('click', () => randomBurst(4 + Math.floor(Math.random() * 4)));
$('clear').addEventListener('click', clearAll);
$('pause').addEventListener('click', e => {
  params.paused = !params.paused;
  e.target.textContent = params.paused ? '再開' : '一時停止';
  e.target.setAttribute('aria-pressed', String(params.paused));
});

// ---------- main loop ----------
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastTime = performance.now();
let simTime = 0;

randomBurst(reducedMotion ? 2 : 4);

function frame (now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  resizeCanvas();

  if (!params.paused) {
    simTime += dt;
    emit(dt, simTime);
    while (stirQueue.length) {
      const s = stirQueue.shift();
      splat(s.point, s.value, s.radius);
    }
    step(dt);
  } else {
    stirQueue.length = 0;
  }

  // slow ambient orbit while idle, so depth stays readable
  if (!reducedMotion && pointers.size === 0 && now - lastInteraction > 4000) {
    cam.theta += 0.06 * dt;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
